<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER-DEFENSE // Mobile Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none;
        }

        body {
            background-color: #030308;
            color: #00ffcc;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
        }

        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 5;
        }

        .hud-box {
            background: rgba(5, 10, 20, 0.85);
            border: 1px solid rgba(0, 255, 204, 0.4);
            padding: 8px 12px;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.15);
            font-size: 0.75rem;
        }

        .hud-box h1 {
            font-size: 0.85rem;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .bar-container {
            width: 120px;
            height: 8px;
            background: #111;
            border: 1px solid #333;
            margin-top: 3px;
            overflow: hidden;
            border-radius: 3px;
        }

        #hp-bar {
            width: 100%;
            height: 100%;
            background: #00ffcc;
            transition: width 0.2s, background 0.2s;
        }

        #emp-bar {
            width: 0%;
            height: 100%;
            background: #00aaff;
            transition: width 0.1s;
        }

        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 5;
            pointer-events: auto;
        }

        .upgrade-row {
            display: flex;
            gap: 8px;
            justify-content: space-between;
        }

        .action-btn {
            background: rgba(5, 10, 20, 0.9);
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 10px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 6px;
            text-align: center;
            flex: 1;
            box-shadow: 0 0 10px rgba(0,255,204,0.2);
        }

        .action-btn:active:not(:disabled) {
            background: #00ffcc;
            color: #030308;
        }

        .action-btn:disabled {
            border-color: #333;
            color: #555;
        }

        #emp-btn {
            background: rgba(0, 170, 255, 0.2);
            border-color: #00aaff;
            color: #00aaff;
            padding: 12px;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        #menu {
            position: absolute;
            background: rgba(5, 8, 18, 0.95);
            border: 2px solid #00ffcc;
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.3);
            padding: 30px 20px;
            text-align: center;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            z-index: 10;
        }

        #menu h2 {
            font-size: 1.6rem;
            margin-bottom: 10px;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
        }

        #menu p {
            color: #bbb;
            margin-bottom: 20px;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .controls-info {
            background: rgba(0, 255, 204, 0.08);
            border: 1px dashed rgba(0, 255, 204, 0.3);
            padding: 10px;
            margin-bottom: 20px;
            font-size: 0.75rem;
            color: #fff;
            text-align: left;
            border-radius: 6px;
        }

        #start-btn {
            background: transparent;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: bold;
            width: 100%;
            border-radius: 6px;
            letter-spacing: 2px;
        }

        #start-btn:active {
            background: #00ffcc;
            color: #030308;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-box">
            <h1>HP: <span id="hp-text">100</span>%</h1>
            <div class="bar-container"><div id="hp-bar"></div></div>
            <h1 style="margin-top: 6px; color: #00aaff;">EMP: <span id="emp-text">0</span>%</h1>
            <div class="bar-container"><div id="emp-bar"></div></div>
        </div>

        <div class="hud-box" style="text-align: right;">
            <h1>WAVE <span id="wave-text">1</span></h1>
            <p style="color: #fff;">SCORE: <span id="score">0</span></p>
            <p style="color: #ffcc00;">BITS: <span id="bits">0</span></p>
        </div>
    </div>

    <div id="mobile-controls" class="hidden">
        <button class="action-btn" id="emp-btn" onclick="triggerEMP()">LIBERAR PULSO EMP</button>
        <div class="upgrade-row">
            <button class="action-btn" id="upg-fire" onclick="buyUpgrade('fire')">CADÊNCIA<br><span id="cost-fire">100</span>B</button>
            <button class="action-btn" id="upg-power" onclick="buyUpgrade('power')">DANO<br><span id="cost-power">150</span>B</button>
            <button class="action-btn" id="upg-heal" onclick="buyUpgrade('heal')">REPARAR<br><span id="cost-heal">120</span>B</button>
        </div>
    </div>

    <div id="menu">
        <h2 id="menu-title">CYBER-DEFENSE</h2>
        <p id="menu-desc">Arraste o dedo na tela para mover o núcleo. O sistema dispara automaticamente contra as ameaças.</p>
        <div class="controls-info">
            <strong>• MOVIMENTO:</strong> Arraste em qualquer lugar<br>
            <strong>• ATAQUE:</strong> Automático em 360°<br>
            <strong>• EMP / UPGRADES:</strong> Botões na parte inferior
        </div>
        <button id="start-btn">JOGAR AGORA</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreEl = document.getElementById('score');
        const bitsEl = document.getElementById('bits');
        const hpText = document.getElementById('hp-text');
        const hpBar = document.getElementById('hp-bar');
        const empText = document.getElementById('emp-text');
        const empBar = document.getElementById('emp-bar');
        const waveText = document.getElementById('wave-text');
        const menu = document.getElementById('menu');
        const menuTitle = document.getElementById('menu-title');
        const menuDesc = document.getElementById('menu-desc');
        const startBtn = document.getElementById('start-btn');
        const mobileControls = document.getElementById('mobile-controls');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Áudio Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'shoot') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.05);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'explosion') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'emp') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        let score = 0, bits = 0, hp = 100, empCharge = 0, wave = 1;
        let enemiesKilledInWave = 0, gameActive = false;
        let animationId, spawnTimeout, shakeTime = 0;

        let fireRate = 350, bulletDamage = 14;
        let costs = { fire: 100, power: 150, heal: 120 };
        let lastShotTime = 0;

        class Player {
            constructor(x, y) {
                this.x = x; this.y = y; this.radius = 20; this.angle = 0;
                this.targetX = x; this.targetY = y;
            }
            updatePosition() {
                // Suavização de movimento touch (Lerp)
                this.x += (this.targetX - this.x) * 0.15;
                this.y += (this.targetY - this.y) * 0.15;
                
                // Limites da tela
                this.x = Math.max(this.radius + 10, Math.min(canvas.width - this.radius - 10, this.x));
                this.y = Math.max(100, Math.min(canvas.height - 180, this.y));
            }
            draw() {
                this.angle += 0.03;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#00ffcc';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00ffcc';
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.rotate(this.angle);
                ctx.beginPath();
                ctx.arc(0, 0, this.radius + 10, 0, Math.PI * 1.5);
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            }
        }

        class Projectile {
            constructor(x, y, velocity, damage) {
                this.x = x; this.y = y; this.velocity = velocity; this.damage = damage; this.radius = 4;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#00ffcc';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00ffcc';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            update() {
                this.draw();
                this.x += this.velocity.x;
                this.y += this.velocity.y;
            }
        }

        class Enemy {
            constructor(x, y, radius, color, velocity, maxHp, isBoss = false) {
                this.x = x; this.y = y; this.radius = radius; this.color = color;
                this.velocity = velocity; this.hp = maxHp; this.maxHp = maxHp; this.isBoss = isBoss;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = this.isBoss ? 20 : 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            update() {
                this.draw();
                this.x += this.velocity.x;
                this.y += this.velocity.y;
            }
        }

        class Particle {
            constructor(x, y, radius, color, velocity) {
                this.x = x; this.y = y; this.radius = radius; this.color = color;
                this.velocity = velocity; this.alpha = 1;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
            update() {
                this.draw();
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= 0.03;
            }
        }

        let player = new Player(canvas.width / 2, canvas.height / 2);
        let projectiles = [], enemies = [], particles = [], floatingTexts = [], shockwaves = [];

        function updateUI() {
            scoreEl.innerText = score;
            bitsEl.innerText = bits;
            hpText.innerText = Math.max(0, hp);
            hpBar.style.width = `${Math.max(0, hp)}%`;
            empText.innerText = Math.min(100, empCharge);
            empBar.style.width = `${Math.min(100, empCharge)}%`;
            waveText.innerText = wave;

            document.getElementById('cost-fire').innerText = costs.fire;
            document.getElementById('cost-power').innerText = costs.power;
            document.getElementById('cost-heal').innerText = costs.heal;

            document.getElementById('upg-fire').disabled = bits < costs.fire || fireRate <= 100;
            document.getElementById('upg-power').disabled = bits < costs.power;
            document.getElementById('upg-heal').disabled = bits < costs.heal || hp >= 100;
            document.getElementById('emp-btn').style.opacity = empCharge >= 100 ? '1' : '0.5';
        }

        function buyUpgrade(type) {
            if (!gameActive) return;
            if (type === 'fire' && bits >= costs.fire && fireRate > 100) {
                bits -= costs.fire; fireRate -= 40; costs.fire = Math.floor(costs.fire * 1.4);
            } else if (type === 'power' && bits >= costs.power) {
                bits -= costs.power; bulletDamage += 8; costs.power = Math.floor(costs.power * 1.4);
            } else if (type === 'heal' && bits >= costs.heal && hp < 100) {
                bits -= costs.heal; hp = Math.min(100, hp + 30); costs.heal = Math.floor(costs.heal * 1.3);
            }
            updateUI();
        }

        function triggerEMP() {
            if (!gameActive || empCharge < 100) return;
            empCharge = 0; shakeTime = 15; playSound('emp');
            enemies.forEach((enemy, index) => {
                score += 50; bits += 10;
                enemies.splice(index, 1);
            });
            updateUI();
        }

        function spawnManager() {
            if (!gameActive) return;

            if (enemiesKilledInWave >= 12) {
                enemiesKilledInWave = 0; wave++;
                const angle = Math.random() * Math.PI * 2;
                const dist = canvas.width / 2 + 50;
                enemies.push(new Enemy(
                    canvas.width / 2 + Math.cos(angle) * dist,
                    canvas.height / 2 + Math.sin(angle) * dist,
                    35, '#ff0055', { x: 0, y: 0 }, 100 + (wave * 40), true
                ));
            } else {
                const radius = Math.random() * 10 + 12;
                let x, y;
                if (Math.random() < 0.5) {
                    x = Math.random() < 0.5 ? -radius : canvas.width + radius;
                    y = Math.random() * canvas.height;
                } else {
                    x = Math.random() * canvas.width;
                    y = Math.random() < 0.5 ? -radius : canvas.height + radius;
                }
                const angle = Math.atan2(player.y - y, player.x - x);
                const speed = 1.2 + (wave * 0.1);
                enemies.push(new Enemy(x, y, radius, '#ff2a6d', { x: Math.cos(angle) * speed, y: Math.sin(angle) * speed }, 15));
            }
            spawnTimeout = setTimeout(spawnManager, Math.max(400, 1000 - (wave * 50)));
        }

        function autoShoot(timestamp) {
            if (timestamp - lastShotTime > fireRate && enemies.length > 0) {
                // Mira no inimigo mais próximo
                let closest = enemies[0];
                let minDst = Math.hypot(player.x - closest.x, player.y - closest.y);
                enemies.forEach(e => {
                    let d = Math.hypot(player.x - e.x, player.y - e.y);
                    if (d < minDst) { minDst = d; closest = e; }
                });

                const angle = Math.atan2(closest.y - player.y, closest.x - player.x);
                projectiles.push(new Projectile(player.x, player.y, { x: Math.cos(angle) * 8, y: Math.sin(angle) * 8 }, bulletDamage));
                playSound('shoot');
                lastShotTime = timestamp;
            }
        }

        function animate(timestamp) {
            if (!gameActive) return;
            animationId = requestAnimationFrame(animate);

            ctx.save();
            if (shakeTime > 0) {
                ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
                shakeTime--;
            }

            ctx.fillStyle = 'rgba(3, 3, 8, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            player.updatePosition();
            player.draw();
            autoShoot(timestamp);

            particles.forEach((p, idx) => {
                if (p.alpha <= 0) particles.splice(idx, 1);
                else p.update();
            });

            projectiles.forEach((proj, pIdx) => {
                proj.update();
                if (proj.x < 0 || proj.x > canvas.width || proj.y < 0 || proj.y > canvas.height) {
                    projectiles.splice(pIdx, 1);
                }
            });

            enemies.forEach((enemy, eIdx) => {
                // Atualiza direção do inimigo em direção ao player suavemente
                const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
                const currentSpeed = Math.hypot(enemy.velocity.x, enemy.velocity.y);
                if (!enemy.isBoss) {
                    enemy.velocity.x = Math.cos(angle) * currentSpeed;
                    enemy.velocity.y = Math.sin(angle) * currentSpeed;
                }
                enemy.update();

                // Colisão Player x Inimigo
                if (Math.hypot(player.x - enemy.x, player.y - enemy.y) < player.radius + enemy.radius) {
                    hp -= enemy.isBoss ? 40 : 15;
                    shakeTime = 10;
                    enemies.splice(eIdx, 1);
                    updateUI();
                    if (hp <= 0) endGame();
                }

                // Colisão Projétil x Inimigo
                projectiles.forEach((proj, pIdx) => {
                    if (Math.hypot(proj.x - enemy.x, proj.y - enemy.y) < enemy.radius + proj.radius) {
                        enemy.hp -= proj.damage;
                        projectiles.splice(pIdx, 1);

                        if (enemy.hp <= 0) {
                            playSound('explosion');
                            score += enemy.isBoss ? 400 : 100;
                            bits += enemy.isBoss ? 100 : 10;
                            empCharge = Math.min(100, empCharge + (enemy.isBoss ? 35 : 8));
                            enemiesKilledInWave++;

                            for (let i = 0; i < 10; i++) {
                                particles.push(new Particle(enemy.x, enemy.y, 2, enemy.color, {
                                    x: (Math.random() - 0.5) * 6, y: (Math.random() - 0.5) * 6
                                }));
                            }
                            enemies.splice(eIdx, 1);
                            updateUI();
                        }
                    }
                });
            });

            ctx.restore();
        }

        function init() {
            player = new Player(canvas.width / 2, canvas.height / 2 - 50);
            projectiles = []; enemies = []; particles = [];
            score = 0; bits = 0; hp = 100; empCharge = 0; wave = 1;
            enemiesKilledInWave = 0; fireRate = 350; bulletDamage = 14;
            costs = { fire: 100, power: 150, heal: 120 };
            gameActive = true;
            mobileControls.classList.remove('hidden');
            updateUI();
        }

        function endGame() {
            gameActive = false;
            cancelAnimationFrame(animationId);
            clearTimeout(spawnTimeout);
            mobileControls.classList.add('hidden');

            menuTitle.innerText = 'GAME OVER';
            menuDesc.innerHTML = `Wave: <strong>${wave}</strong> | Score: <strong style="color:#00ffcc">${score}</strong>`;
            startBtn.innerText = 'JOGAR NOVAMENTE';
            menu.classList.remove('hidden');
        }

        // Controles Touch / Mouse para mover o jogador
        window.addEventListener('pointermove', (e) => {
            if (!gameActive) return;
            player.targetX = e.clientX;
            player.targetY = e.clientY;
        });

        startBtn.addEventListener('click', () => {
            menu.classList.add('hidden');
            init();
            requestAnimationFrame(animate);
            spawnManager();
        });
    </script>
</body>
</html>
